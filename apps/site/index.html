<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- The theme before first paint: the visitor's choice, else the system's. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('codearchy.site.theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)" />

    <!-- Primary Meta Tags -->
    <title>CodeArchy: see how your codebase is built</title>
    <meta name="title" content="CodeArchy: see how your codebase is built" />
    <meta name="description" content="CodeArchy maps any repository into an architecture you can explore: dependencies, request flows, who owns each part, and how much AI wrote. Free and open source, for VS Code, the browser and your AI agent. Runs on your machine." />
    <meta name="keywords" content="CodeArchy, code architecture, architecture map, codebase visualization, code ownership, bus factor, AI authorship, AI-written code, request flows, onboarding, VS Code extension, Cursor, MCP, open source" />
    <meta name="author" content="CodeArchy" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://codearchy.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/images/mark-dark.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/assets/images/mark-light.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/assets/images/logo.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codearchy.com/" />
    <meta property="og:title" content="CodeArchy: see how your codebase is built" />
    <meta property="og:description" content="An architecture map of your code: dependencies, request flows, who owns each part, and how much AI wrote. Free and open source." />
    <meta property="og:image" content="https://codearchy.com/assets/images/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="CodeArchy" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://codearchy.com/" />
    <meta name="twitter:title" content="CodeArchy: see how your codebase is built" />
    <meta name="twitter:description" content="An architecture map of your code: dependencies, request flows, who owns each part, and how much AI wrote. Free and open source." />
    <meta name="twitter:image" content="https://codearchy.com/assets/images/og.png" />

    <!-- JSON-LD Structured Data -->

    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "CodeArchy",
      "applicationCategory": "DeveloperApplication",
      "applicationSubCategory": "Code Analysis Tool",
      "operatingSystem": "Windows, macOS, Linux, Web",
      "description": "An architecture map of your code, generated on your machine: dependencies, request flows, who owns each part, and how much AI wrote. For VS Code, the browser and your AI agent (MCP).",
      "url": "https://codearchy.com/",
      "downloadUrl": "https://marketplace.visualstudio.com/items?itemName=iyinusa.codearchy",
      "installUrl": "vscode:extension/iyinusa.codearchy",
      "license": "https://github.com/CodeArchy/codearchy/blob/main/LICENSE",
      "softwareVersion": "2.1.1",
      "dateModified": "2026-11-26",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "featureList": [
        "Architecture map from the code: packages, components, files and symbols",
        "Ownership: who owns each part, with the bus factor",
        "AI authorship from git evidence",
        "Request flows traced call by call",
        "Guided onboarding tours",
        "Questions answered with citations",
        "10 languages: TypeScript, JavaScript, Python, Java, Kotlin, Go, Rust, C#, PHP and Ruby",
        "Private by default: parsed on your machine; AI optional"
      ],
      "releaseNotes": "https://github.com/CodeArchy/codearchy/blob/main/apps/vscode/CHANGELOG.md",
      "codeRepository": "https://github.com/CodeArchy/codearchy",

    <!-- Google Analytics runs only after a visitor allows it (src/lib/consent.js loads it then).
         Until then every consent signal is denied and nothing is requested from Google. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied'
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
