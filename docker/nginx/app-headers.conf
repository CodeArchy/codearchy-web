# Security headers for app.codearchy.com, included in every location of app.conf:
# nginx drops inherited add_header lines in any location that adds its own.
# No analytics or third-party code: everything is 'self'. 'wasm-unsafe-eval':
# tree-sitter and SQLite run as WebAssembly. Inline styles: React Flow and
# CodeMirror position and theme elements with them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
