# Security headers for app.codearchy.com, included in every location of app.conf:
# nginx drops inherited add_header lines in any location that adds its own.
# No analytics or third-party code: scripts, styles and workers are 'self'.
# connect-src adds only the AI providers a user can choose (called straight from
# this browser with the user's own key) and Ollama / LM Studio on localhost.
# 'wasm-unsafe-eval':
# tree-sitter and SQLite run as WebAssembly. Inline styles: React Flow and
# CodeMirror position and theme elements with them.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com https://openrouter.ai https://api.groq.com https://api.mistral.ai http://localhost:11434 http://127.0.0.1:11434 http://localhost:1234 http://127.0.0.1:1234; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
