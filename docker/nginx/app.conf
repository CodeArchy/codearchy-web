# app.codearchy.com: the web app (apps/app). Selected by host name, so any app.*
# host (previews too) gets it. Code is analysed in the browser; the app makes
# no requests beyond its own origin.
server {
    listen 80;
    listen [::]:80;
    server_name ~^app\.;
    root /usr/share/nginx/app;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/wasm image/svg+xml;

    include /etc/nginx/snippets/app-headers.conf;

    # The service worker and the manifest must always be revalidated, or updates never arrive.
    location = /sw.js {
        include /etc/nginx/snippets/app-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/app-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Hashed bundles and workers, and the engine's wasm (in a folder named by content hash): immutable.
    location ^~ /assets/ {
        include /etc/nginx/snippets/app-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }
    location ^~ /engine/ {
        include /etc/nginx/snippets/app-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # The app shell (index.html for every route).
    location / {
        include /etc/nginx/snippets/app-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
