# CodeArchy Web — Production Docker Compose
#
# Designed for Dokploy + Traefik on Hostinger.
# Traefik routes domain traffic directly to the container over the internal
# dokploy-network — NO host port mapping is needed or desired here.
#
# For local standalone runs without Dokploy use docker-compose.dev.yml
# (which does expose a host port for direct browser access).
#
# Do NOT add `ports:` — it causes "port already allocated" errors and bypasses
# Traefik. Do NOT use `network_mode: host`.

services:
  codearchy-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: codearchy-web:latest
    container_name: codearchy-web
    restart: unless-stopped
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  dokploy-network:
    external: true
